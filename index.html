<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>교관 시간표</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#1B2A41">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="교관 시간표">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#1B2A41; --muted:#5F6F84; --line:#DCE2EA;
  --rescue:#E4570F; --rescue-soft:#FDEBE0; --signal:#F2C21B; --calm:#2F6F7E; --calm-soft:#E3F0F2;
  --done:#9AA6B5;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10161F; --surface:#1A2330; --ink:#E7ECF2; --muted:#9AA8BA; --line:#2B3747;
    --rescue:#FF7A33; --rescue-soft:#3A2418; --signal:#F2C21B; --calm:#6FB7C6; --calm-soft:#17313A;
    --done:#5E6B7C; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10161F; --surface:#1A2330; --ink:#E7ECF2; --muted:#9AA8BA; --line:#2B3747;
  --rescue:#FF7A33; --rescue-soft:#3A2418; --signal:#F2C21B; --calm:#6FB7C6; --calm-soft:#17313A;
  --done:#5E6B7C; color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 120px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:4px 2px 14px}
header.top h1{font-size:1.15rem;font-weight:700;margin:0;letter-spacing:-.01em}
header.top{align-items:center}
.title{display:flex;align-items:center;gap:8px}
.mascot{height:77px;width:auto;flex:0 0 auto;filter:drop-shadow(0 2px 3px rgba(0,0,0,.15))}
.status{font-size:.8rem;color:var(--muted);white-space:nowrap}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--calm);outline-offset:2px}

.weeks{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.weeks::-webkit-scrollbar{display:none}
.wk{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:.88rem;color:var(--muted)}
.span{display:flex;gap:0;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:0 0 auto}
.span button{border:0;background:var(--surface);color:var(--muted);padding:5px 12px;font-size:.85rem}
.span button[aria-pressed="true"]{background:var(--calm);color:#fff;font-weight:500}
.navrow{display:flex;align-items:center;gap:8px}
.navrow .weeks{flex:1;min-width:0}
.wk.inrange{border-color:var(--ink);color:var(--ink)}
.wk[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:500}

section{margin-top:22px}
h2{font-size:1rem;margin:0 2px 10px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 small{font-weight:400;color:var(--muted);font-size:.82rem}

/* week list */
.days{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.day{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;
  background:none;border:0;border-top:1px solid var(--line);padding:11px 12px;position:relative}
.day:first-child{border-top:0}
.day.special::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--signal)}
.day.today{background:var(--calm-soft)}
.dd{display:flex;flex-direction:column;line-height:1.2}
.dd b{font-size:1.05rem;font-variant-numeric:tabular-nums}
.dd span{font-size:.8rem;color:var(--muted)}
.dt{min-width:0}
.dt .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dt .t.empty{color:var(--muted);font-weight:400}
.dt .s{font-size:.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:.72rem;border-radius:6px;padding:2px 6px;background:var(--bg);color:var(--muted);white-space:nowrap}
.tag.trip{background:var(--rescue-soft);color:var(--rescue);font-weight:500}
.tag.fit{background:var(--calm-soft);color:var(--calm)}

/* horizontal calendar */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.calhead,.wrow{display:grid;grid-template-columns:repeat(5,minmax(0,1.3fr)) repeat(2,minmax(0,.7fr))}
.calhead span.we{color:var(--done)}
.cell.wkend{background:var(--bg)}
.cell.wkend.today{background:var(--calm-soft)}
.calhead span{text-align:center;font-size:.78rem;color:var(--muted);padding:6px 0;border-bottom:1px solid var(--line)}
.wkhead{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;font-size:.85rem;font-weight:700;background:var(--bg);border-top:1px solid var(--line)}
.calhead + .wkhead{border-top:0}
.wkhead small{font-weight:400;color:var(--muted);font-size:.76rem}
.cell{min-height:104px;border:0;border-left:1px solid var(--line);border-top:1px solid var(--line);background:none;text-align:left;padding:8px 4px 6px;display:flex;flex-direction:column;gap:3px;position:relative;min-width:0}
.cell:first-child{border-left:0}
.cell.special::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--signal)}
.cell.today{background:var(--calm-soft)}
.cell .n{font-weight:700;font-size:.95rem;line-height:1.1;font-variant-numeric:tabular-nums}
.cell .n small{font-weight:500;font-size:.66rem;color:var(--calm);margin-left:2px}
.cell .ct{font-size:.7rem;line-height:1.3;font-weight:500;word-break:keep-all;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cell .ct.empty{color:var(--muted);font-weight:400}
.cell .cp{font-size:.62rem;line-height:1.25;color:var(--muted);word-break:keep-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cell .cf{margin-top:auto;display:flex;gap:3px;flex-wrap:wrap}
.mini{font-size:.62rem;line-height:1.4;border-radius:4px;padding:0 4px;background:var(--bg);color:var(--muted)}
.mini.trip{background:var(--rescue-soft);color:var(--rescue);font-weight:500}
.mini.fit{background:var(--calm-soft);color:var(--calm)}
@media (min-width:480px){.cell .ct{font-size:.8rem}.cell .cp{font-size:.72rem}}

.cell .cw{font-size:.66rem;line-height:1.2;color:var(--muted);white-space:nowrap;overflow:hidden}
.cell .cw b{font-size:.8rem;font-weight:400}
.wxline{padding:4px 16px 10px;font-size:.9rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wxline .big{font-size:1.5rem;line-height:1}
.wxline .rain{color:var(--calm);font-weight:500}
.credit{font-size:.75rem;color:var(--muted);text-align:center;margin:26px 0 0}
.credit a{color:inherit}

/* tomorrow: the dispatch card */
.dispatch{background:var(--surface);border:2px solid var(--ink);border-radius:16px;overflow:hidden}
.dispatch .band{height:10px;background:var(--ink)}
.dispatch.special .band{background:repeating-linear-gradient(-45deg,var(--signal) 0 12px,#1B2A41 12px 24px)}
.dispatch .head{display:flex;justify-content:space-between;align-items:flex-end;padding:14px 16px 6px;gap:10px}
.dispatch .when{font-size:2rem;font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.dispatch .when span{font-size:1rem;font-weight:500;color:var(--muted);margin-left:6px}
.dispatch .label{font-size:.85rem;color:var(--muted)}
.mission{padding:10px 16px 14px;border-top:1px dashed var(--line)}
.mission:first-of-type{border-top:0}
.mission h3{margin:0;font-size:1.1rem}
.meta{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:.88rem;margin:6px 0 8px}
.meta dt{color:var(--muted)} .meta dd{margin:0}
.meta dd.missing{color:var(--rescue)}
.fitline,.noteline{padding:10px 16px;border-top:1px dashed var(--line);font-size:.88rem}
.noteline{color:var(--muted)}
.empty-day{padding:8px 16px 16px;color:var(--muted)}

/* checklists */
.checks{list-style:none;margin:0;padding:0}
.checks li{display:flex;align-items:center;gap:10px;padding:6px 0}
.checks input[type=checkbox]{width:22px;height:22px;accent-color:var(--calm);flex:0 0 auto}
.checks .txt{flex:1;min-width:0;word-break:break-word}
.checks li.done .txt{color:var(--done);text-decoration:line-through}
.x{border:0;background:none;color:var(--muted);font-size:1.1rem;padding:4px 8px;border-radius:8px}
.add{display:flex;gap:8px;margin-top:6px}
.add input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px}
.add button,.btn{border:0;background:var(--ink);color:var(--bg);border-radius:10px;padding:9px 14px;font-weight:500;white-space:nowrap}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--rescue);border:1px solid var(--line)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.hint{font-size:.85rem;color:var(--muted);margin:0 0 8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.chip{border:1px dashed var(--line);background:none;border-radius:999px;padding:4px 10px;font-size:.82rem;color:var(--muted)}
textarea.guard{width:100%;min-height:72px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;resize:vertical}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;padding:0 16px env(safe-area-inset-bottom,0px);pointer-events:none;display:flex;justify-content:center}
.bar .inner{max-width:560px;width:100%;display:flex;justify-content:flex-end;padding-bottom:16px}
.fab{pointer-events:auto;border:0;background:var(--rescue);color:#fff;border-radius:999px;padding:13px 20px;font-weight:700;box-shadow:0 6px 18px rgba(228,87,15,.35)}

/* sheet */
dialog.sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:560px;max-height:90%;border-radius:18px 18px 0 0;background:var(--surface);color:var(--ink)}
dialog.sheet::backdrop{background:rgba(10,15,25,.45)}
.sheet .sh{position:sticky;top:0;background:var(--surface);display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);z-index:1}
.sheet .sh b{font-size:1.1rem}
.sheet .body{padding:12px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:.8rem;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.flabel{font-size:.8rem;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.segb{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 2px;font-weight:500;display:flex;flex-direction:column;align-items:center;line-height:1.25}
.segb small{font-size:.66rem;font-weight:400;color:var(--muted)}
.segb[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.segb[aria-pressed="true"] small{color:var(--bg);opacity:.75}
.itemcard{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.itemcard .ih{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.toggle{display:flex;align-items:center;gap:10px;padding:8px 0}
.toggle input{width:22px;height:22px;accent-color:var(--calm)}
.sub{font-size:.85rem;font-weight:700;margin:6px 0 2px}
@media (prefers-reduced-motion: no-preference){
  dialog.sheet[open]{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
}
</style>
</head>

<script>
(function(){
"use strict";
const SEED = {"v": 1, "days": {}, "study": [], "memo": [], "guard": ""};
const LS_KEY = "rescue-schedule-v1";
const START = new Date(2026,10,2);
const DOW = ["월","화","수","목","금","토","일"];
const ROLES = ["수업","출장","시찰","운영","기타"];
const isClass = r => r==="보조"||r==="수업";
const roleLabel = r => r==="보조" ? "수업" : r;
const TIMES = [{l:"종일",v:"09:00–16:00"},{l:"오전",v:"09:00–11:30"},{l:"오후",v:"13:00–16:00"}];
const pad = n => String(n).padStart(2,"0");
const keyOf = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const DAYS = [];
for(let w=0; w<8; w++) for(let i=0;i<7;i++){
  const d = new Date(START); d.setDate(d.getDate()+w*7+i);
  DAYS.push({key:keyOf(d), week:17+w, dow:i, m:d.getMonth()+1, d:d.getDate()});
}
const dayInfo = Object.fromEntries(DAYS.map(x=>[x.key,x]));
const rid = () => Math.random().toString(36).slice(2,8);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone = o => JSON.parse(JSON.stringify(o));

let state = null;
try{ const raw = localStorage.getItem(LS_KEY); if(raw) state = JSON.parse(raw); }catch(e){}
if(!state || !state.days) state = clone(SEED);
normalize();

function normalize(){
  state.days = state.days || {}; state.study = state.study || []; state.memo = state.memo || [];
  if(typeof state.guard !== "string") state.guard = "";
}
function day(k){ if(!state.days[k]) state.days[k] = {items:[],fitness:false,note:""}; return state.days[k]; }
function peek(k){ return state.days[k] || {items:[],fitness:false,note:""}; }

const todayKey = keyOf(new Date());
function currentWeek(){
  if(dayInfo[todayKey]) return dayInfo[todayKey].week;
  const t = new Date(); t.setHours(0,0,0,0);
  if(t < START) return 17;
  // weekend inside range: week of following Monday or previous
  for(const x of DAYS){ const dd=new Date(x.key+"T00:00:00"); if(dd>=t) return x.week; }
  return 24;
}
function tomorrowKey(){
  const t = new Date(); t.setHours(0,0,0,0);
  for(const x of DAYS){ const dd=new Date(x.key+"T00:00:00"); if(dd>t) return x.key; }
  return null;
}
let selWeek = currentWeek();
/* ---------- weather (Open-Meteo, 광주 소촌동) ---------- */
const WX_URL = "https://api.open-meteo.com/v1/forecast?latitude=35.15&longitude=126.80&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FSeoul&forecast_days=16";
const WX_KEY = "rescue-weather-v1";
let wx = null;
try{ const c = JSON.parse(localStorage.getItem(WX_KEY)||"null"); if(c && c.days) wx = c; }catch(e){}
function wxInfo(code){
  if(code===0) return ["☀️","맑음"];
  if(code===1||code===2) return ["🌤️","구름 조금"];
  if(code===3) return ["☁️","흐림"];
  if(code===45||code===48) return ["🌫️","안개"];
  if(code>=51&&code<=57) return ["🌦️","이슬비"];
  if((code>=61&&code<=67)||(code>=80&&code<=82)) return ["🌧️","비"];
  if((code>=71&&code<=77)||code===85||code===86) return ["❄️","눈"];
  if(code>=95) return ["⛈️","뇌우"];
  return ["🌡️","날씨"];
}
async function loadWeather(){
  if(wx && Date.now()-wx.at < 60*60*1000) return;
  try{
    const r = await fetch(WX_URL); if(!r.ok) throw 0;
    const j = await r.json(); const d = j.daily; const days = {};
    d.time.forEach((k,i)=>{ days[k] = {c:d.weather_code[i], hi:Math.round(d.temperature_2m_max[i]), lo:Math.round(d.temperature_2m_min[i]), p:d.precipitation_probability_max ? d.precipitation_probability_max[i] : null}; });
    wx = {at:Date.now(), days};
    try{ localStorage.setItem(WX_KEY, JSON.stringify(wx)); }catch(e){}
    if(!sheet.open) render();
  }catch(e){ /* keep last cached weather */ }
}
const wxOf = k => (wx && wx.days && wx.days[k] && k >= todayKey) ? wx.days[k] : null;
let span = 2; try{ const v = +localStorage.getItem("rescue-span"); if(v===2||v===3) span = v; }catch(e){}

/* ---------- saving ---------- */
let mode = "loading", ref = null, dirty = false, writing = false, timer = null;
const statusEl = document.getElementById("status");
function setStatus(t){ statusEl.textContent = t; }
function changed(){
  dirty = true; setStatus("저장 중…");
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
  clearTimeout(timer); timer = setTimeout(flush, 600);
}
async function flush(){
  if(writing || !dirty) return;
  if(mode !== "db"){ dirty=false; setStatus(mode==="loading" ? "이 기기에 저장됨" : "이 기기에 저장됨"); return; }
  dirty = false; writing = true;
  try{ await ref.set(clone(state)); setStatus("저장됨"); }
  catch(e){
    if(e && e.code === "unavailable"){ dirty = true; setTimeout(()=>{writing=false; flush();}, 800+Math.random()*900); return; }
    mode = "local"; setStatus("이 기기에만 저장됨");
  }
  writing = false;
  if(dirty) flush();
}

async function connect(){
  if(!window.claude || typeof window.claude.use !== "function"){ mode="local"; setStatus("이 기기에 저장됨"); return; }
  const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
  if(!db || !user){ mode="local"; setStatus("이 기기에 저장됨"); return; }
  let id = null; try{ id = await user.id(); }catch(e){}
  if(!id){ mode="local"; setStatus("이 기기에 저장됨"); return; }
  ref = db.collection("data/users/"+id).doc("plan");
  let settled = false;
  const slow = setTimeout(()=>{ if(!settled) setStatus("연결 중… 이 기기에 먼저 저장해요"); }, 10000);
  ref.onSnapshot(snap=>{
    if(!snap.metadata.fromCache){ settled = true; clearTimeout(slow); }
    mode = "db";
    if(snap.metadata.hasPendingWrites || dirty || writing) return;
    if(snap.exists){
      state = clone(snap.data()); normalize();
      try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
      if(!sheet.open) render();
    }
    if(!snap.metadata.fromCache) setStatus("저장됨");
  }, err=>{
    settled = true; clearTimeout(slow); mode = "local"; setStatus("이 기기에만 저장됨");
  });
}

/* ---------- render ---------- */
const weeksEl = document.getElementById("weeks");
const app = document.getElementById("app");
function renderWeeks(){
  let h = "";
  for(let w=17; w<=24; w++){
    const lab = (w===21||w===22) ? w+"주 관서실습" : w+"주";
    const inr = w>selWeek && w<selWeek+span;
    h += `<button class="wk${inr?" inrange":""}" type="button" data-act="week" data-w="${w}" aria-pressed="${w===selWeek}">${lab}</button>`;
  }
  weeksEl.innerHTML = h;
  document.getElementById("span").innerHTML = [2,3].map(n=>`<button type="button" data-act="span" data-n="${n}" aria-pressed="${n===span}">${n}주</button>`).join("");
  const on = weeksEl.querySelector('[aria-pressed="true"]');
  if(on) on.scrollIntoView({block:"nearest",inline:"center"});
}
function dayRow(x){
  const dd = peek(x.key);
  const sp = dd.items.some(i=>i.special);
  const titles = dd.items.map(i=>i.title).filter(Boolean).join(", ");
  const roles = [...new Set(dd.items.map(i=>i.role))].filter(r=>r && r!=="보조");
  const places = dd.items.map(i=>i.place).filter(Boolean).join(", ");
  let sub = places || (dd.items.length ? "" : (x.dow===2||x.dow===4 ? "16시 이후 여유가 생길 수 있어요" : ""));
  if(dd.note && !sub) sub = dd.note;
  let tags = roles.map(r=>`<span class="tag trip">${esc(r)}</span>`).join("");
  if(dd.items.some(i=>i.role==="보조")) tags += `<span class="tag">보조</span>`;
  if(dd.fitness) tags += `<span class="tag fit">체력</span>`;
  return `<button type="button" class="day${sp?" special":""}${x.key===todayKey?" today":""}" data-act="open" data-k="${x.key}" aria-label="${x.m}월 ${x.d}일 ${DOW[x.dow]}요일 일정 편집">
    <span class="dd"><b>${x.m}.${pad(x.d)}</b><span>${DOW[x.dow]}${x.key===todayKey?" · 오늘":""}</span></span>
    <span class="dt"><div class="t${titles?"":" empty"}">${titles?esc(titles):"비는 날"}</div>${sub?`<div class="s">${esc(sub)}</div>`:""}</span>
    <span class="tags">${tags}</span></button>`;
}
function cell(x){
  const dd = peek(x.key);
  const sp = dd.items.some(i=>i.special);
  const titles = dd.items.map(i=>i.title).filter(Boolean).join(" / ");
  const places = [...new Set(dd.items.map(i=>i.place).filter(Boolean))].join(", ");
  const roles = [...new Set(dd.items.map(i=>roleLabel(i.role)))].filter(r=>r && r!=="수업");
  let tags = roles.map(r=>`<span class="mini trip">${esc(r)}</span>`).join("");
  if(dd.fitness) tags += `<span class="mini fit">체력</span>`;
  const isT = x.key===todayKey;
  const we = x.dow>4;
  return `<button type="button" class="cell${sp?" special":""}${isT?" today":""}${we?" wkend":""}" data-act="open" data-k="${x.key}" aria-label="${x.m}월 ${x.d}일 ${DOW[x.dow]}요일${titles?", "+esc(titles):", 비는 날"} 편집">
    <span class="n">${x.d===1||x.dow===0?x.m+"/":""}${x.d}</span>
    ${(()=>{ const w = wxOf(x.key); if(!w) return ""; const [ic,lb] = wxInfo(w.c); return `<span class="cw" title="${lb} ${w.hi}° / ${w.lo}°"><b>${ic}</b>${we?"":" "+w.hi+"°"}</span>`; })()}
    <span class="ct${titles?"":" empty"}">${titles?esc(titles):(we?"수업 없음":"비는 날")}</span>
    ${places?`<span class="cp">${esc(places)}</span>`:""}
    <span class="cf">${tags}</span></button>`;
}
function checklist(list, scope, extra){
  let h = `<ul class="checks">`;
  list.forEach(p=>{
    h += `<li class="${p.d?"done":""}"><input type="checkbox" ${p.d?"checked":""} data-act="tick" data-scope="${scope}" data-id="${p.id}" ${extra||""} aria-label="${esc(p.t)} 완료">
      <span class="txt">${esc(p.t)}</span>
      <button type="button" class="x" data-act="del" data-scope="${scope}" data-id="${p.id}" ${extra||""} aria-label="${esc(p.t)} 지우기">×</button></li>`;
  });
  return h + `</ul>`;
}
function renderTomorrow(){
  const k = tomorrowKey();
  if(!k) return `<section><h2>다음 일정</h2><div class="panel">17~24주 일정이 모두 끝났어요.</div></section>`;
  const x = dayInfo[k], dd = peek(k);
  const sp = dd.items.some(i=>i.special);
  const label = (()=>{ const t=new Date(); t.setHours(0,0,0,0); const n=new Date(t); n.setDate(n.getDate()+1); return keyOf(n)===k ? "내일" : "다음 근무일"; })();
  let h = `<section aria-labelledby="tmrH"><h2 id="tmrH">${label} 일정 <small>${x.week}주</small></h2>
  <div class="dispatch${sp?" special":""}"><div class="band"></div>
  <div class="head"><div class="when">${x.m}.${pad(x.d)}<span>${DOW[x.dow]}요일</span></div>
  <button type="button" class="btn ghost" data-act="open" data-k="${k}">편집</button></div>`;
  const tw = wxOf(k);
  if(tw){ const [ic,lb] = wxInfo(tw.c); h += `<div class="wxline"><span class="big">${ic}</span><span>${lb} · 최고 ${tw.hi}° / 최저 ${tw.lo}°</span>${tw.p!=null?`<span class="rain">비 올 확률 ${tw.p}%</span>`:""}</div>`; }
  if(!dd.items.length){
    h += `<div class="empty-day">${x.dow>4?"수업이 없는 날이에요.":"비는 날이에요."}${x.dow===2||x.dow===4?" 여유가 생기면 예습 거리를 꺼내 보세요.":""}</div>`;
  }
  dd.items.forEach(it=>{
    h += `<div class="mission"><h3>${esc(it.title||"제목 없음")}</h3>
      <dl class="meta"><dt>시간</dt><dd>${esc(it.time||"-")}</dd>
      <dt>장소</dt><dd class="${it.place?"":"missing"}">${it.place?esc(it.place):"장소를 입력해 주세요"}</dd>
      <dt>구분</dt><dd>${esc(roleLabel(it.role))}${it.main?" · "+esc(it.main):""}</dd></dl>
      <div class="sub">준비할 것</div>
      ${checklist(it.prep||[], "prep", `data-k="${k}" data-item="${it.id}"`)}
      <div class="add"><input type="text" placeholder="준비할 것 추가" data-addfor="prep" data-k="${k}" data-item="${it.id}" aria-label="${esc(it.title)} 준비할 것 추가"><button type="button" data-act="add" data-scope="prep" data-k="${k}" data-item="${it.id}">추가</button></div>
    </div>`;
  });
  if(dd.fitness) h += `<div class="fitline">16:00–17:30 체력단련</div>`;
  if(dd.note) h += `<div class="noteline">${esc(dd.note)}</div>`;
  return h + `</div></section>`;
}
function renderStudy(){
  const nw = selWeek < 24 ? selWeek+1 : 24;
  const list = state.study.filter(s=>s.week===nw);
  const classes = [...new Set(DAYS.filter(x=>x.week===nw).flatMap(x=>peek(x.key).items.filter(i=>isClass(i.role)).map(i=>i.title)))];
  return `<section aria-labelledby="stH"><h2 id="stH">${nw}주 예습 거리 <small>여유가 생기면 꺼내 보기</small></h2><div class="panel">
    ${classes.length?`<p class="hint">${nw}주 수업이에요. 누르면 입력칸에 이름이 들어가요.</p><div class="chips">${classes.map(c=>`<button type="button" class="chip" data-act="prefill" data-t="${esc(c)}">${esc(c)}</button>`).join("")}</div>`:`<p class="hint">${nw}주에는 수업이 없어요.</p>`}
    ${checklist(list,"study")}
    <div class="add"><input type="text" id="studyIn" placeholder="예: 로프 매듭 순서 복습" data-addfor="study" aria-label="예습 거리 추가"><button type="button" data-act="add" data-scope="study">추가</button></div>
  </div></section>`;
}
function renderMemo(){
  return `<section aria-labelledby="mmH" id="memoSec"><h2 id="mmH">떠오른 할 일 <small>생각났을 때 바로</small></h2><div class="panel">
    <div class="add" style="margin:0 0 6px"><input type="text" id="memoIn" placeholder="떠오른 할 일을 적어 두세요" data-addfor="memo" aria-label="떠오른 할 일 추가"><button type="button" data-act="add" data-scope="memo">추가</button></div>
    ${state.memo.length?checklist(state.memo,"memo"):`<p class="hint" style="margin:6px 0 0">아직 적어 둔 할 일이 없어요.</p>`}
  </div></section>`;
}
function renderGuard(){
  return `<section aria-labelledby="gdH"><h2 id="gdH">지키는 시간 <small>개인 운동·가족</small></h2><div class="panel">
    <textarea class="guard" data-act="guard" aria-label="지키는 시간">${esc(state.guard)}</textarea></div></section>
    <section aria-labelledby="bkH"><h2 id="bkH">백업 <small>휴대폰을 바꾸거나 초기화하기 전에</small></h2><div class="panel">
    <p class="hint">입력한 내용은 이 휴대폰에만 저장돼요. 가끔 백업 파일을 저장해 두세요.</p>
    <div class="add" style="margin:0"><button type="button" data-act="export">백업 파일 저장</button><button type="button" class="btn ghost" data-act="import">백업 불러오기</button></div>
    <input type="file" id="importFile" accept="application/json,.json" hidden></div></section>
    <p class="credit">날씨 정보: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> (광주 소촌동, CC BY 4.0)</p>`;
}
function render(){
  renderWeeks();
  let weeksHtml = `<section style="margin-top:6px" aria-label="주간 시간표"><div class="cal"><div class="calhead">${DOW.map((d,i)=>`<span class="${i>4?"we":""}">${d}</span>`).join("")}</div>`;
  for(let w=selWeek; w<=Math.min(selWeek+span-1,24); w++){
    const wd = DAYS.filter(x=>x.week===w);
    const nAssist = wd.reduce((n,x)=>n+peek(x.key).items.filter(i=>isClass(i.role)).length,0);
    const tag = w===currentWeek() ? " · 이번 주" : (w===currentWeek()+1 ? " · 다음 주" : "");
    const extra = (w===21||w===22) ? " · 관서실습" : "";
    weeksHtml += `<div class="wkhead"><span>${w}주${tag}${extra}</span><small>수업 ${nAssist}회</small></div><div class="wrow">${wd.map(cell).join("")}</div>`;
  }
  weeksHtml += `</div></section>`;
  const blank = !Object.values(state.days).some(d=>d.items && d.items.length);
  const intro = blank ? `<section style="margin-top:6px"><div class="panel"><p class="hint" style="margin:0 0 8px">아직 일정이 비어 있어요. 받아 둔 일정 백업 파일(.json)을 불러오거나, 날짜를 눌러 직접 입력해 주세요.</p><button type="button" class="btn" data-act="import">일정 파일 불러오기</button></div></section>` : "";
  app.innerHTML = intro + weeksHtml
    + `<p class="hint" style="margin:8px 2px 0">날짜를 누르면 편집할 수 있어요.</p>`
    + renderTomorrow() + renderStudy() + renderMemo() + renderGuard();
}

/* ---------- list helpers ---------- */
function listFor(el){
  const s = el.dataset.scope;
  if(s==="study") return state.study;
  if(s==="memo") return state.memo;
  if(s==="prep"){ const it = day(el.dataset.k).items.find(i=>i.id===el.dataset.item); if(it){ it.prep = it.prep||[]; return it.prep; } }
  return null;
}
function addFrom(btn){
  const s = btn.dataset.scope;
  const box = btn.parentElement.querySelector("input");
  const t = box.value.trim(); if(!t){ box.focus(); return; }
  const list = listFor(btn); if(!list) return;
  const item = {id:rid(), t, d:false};
  if(s==="study") item.week = selWeek<24 ? selWeek+1 : 24;
  list.push(item); changed();
  const inSheet = btn.closest("dialog");
  if(inSheet){ renderSheet(); render(); const nb = sheet.querySelector(`input[data-addfor="prep"][data-item="${btn.dataset.item}"]`); if(nb) nb.focus(); }
  else { render(); const nb = s==="prep" ? app.querySelector(`input[data-addfor="prep"][data-item="${btn.dataset.item}"]`) : app.querySelector(`input[data-addfor="${s}"]`); if(nb) nb.focus(); }
}

document.addEventListener("click", e=>{
  const el = e.target.closest("[data-act]"); if(!el) return;
  const a = el.dataset.act;
  if(a==="week"){ selWeek = +el.dataset.w; render(); }
  else if(a==="span"){ span = +el.dataset.n; try{ localStorage.setItem("rescue-span", String(span)); }catch(e){} render(); }
  else if(a==="open"){ openSheet(el.dataset.k); }
  else if(a==="add"){ addFrom(el); }
  else if(a==="del"){
    const list = listFor(el); if(!list) return;
    const i = list.findIndex(p=>p.id===el.dataset.id); if(i>-1) list.splice(i,1);
    changed(); if(el.closest("dialog")) renderSheet(); render();
  }
  else if(a==="export"){
    const blob = new Blob([JSON.stringify(state,null,1)],{type:"application/json"});
    const u = URL.createObjectURL(blob); const link = document.createElement("a");
    link.href = u; link.download = "구조시간표_백업_"+todayKey+".json"; document.body.appendChild(link); link.click();
    setTimeout(()=>{URL.revokeObjectURL(u); link.remove();},1000);
  }
  else if(a==="import"){ document.getElementById("importFile").click(); }
  else if(a==="prefill"){ const inp=document.getElementById("studyIn"); inp.value = el.dataset.t+": "; inp.focus(); }
  else if(a==="close"){ sheet.close(); }
  else if(a==="settime" || a==="customtime"){
    const it = day(curKey).items.find(i=>i.id===el.dataset.item); if(!it) return;
    it.time = a==="settime" ? el.dataset.v : (TIMES.some(o=>o.v===it.time) ? "" : it.time);
    changed(); renderSheet(); render();
    if(a==="customtime"){ const inp = sheet.querySelector(`input[data-f="time"][data-item="${it.id}"]`); if(inp) inp.focus(); }
  }
  else if(a==="additem"){ day(curKey).items.push({id:rid(),title:"",role:"수업",time:"09:00–16:00",place:"",main:"",special:false,prep:[]}); changed(); renderSheet(); render();
    const last = sheet.querySelectorAll('input[data-f="title"]'); if(last.length) last[last.length-1].focus(); }
  else if(a==="delitem"){ const its=day(curKey).items; const i=its.findIndex(x=>x.id===el.dataset.item);
    if(i>-1 && confirm("이 일정을 지울까요?")){ its.splice(i,1); changed(); renderSheet(); render(); } }
});
document.addEventListener("change", e=>{
  const el = e.target;
  if(el.id==="importFile" && el.files && el.files[0]){
    el.files[0].text().then(txt=>{
      try{ const s = JSON.parse(txt); if(!s || !s.days) throw 0;
        if(!confirm("백업 파일로 바꿀까요? 지금 내용은 백업 내용으로 덮어써져요.")) return;
        state = s; normalize(); changed(); render(); setStatus("백업을 불러왔어요");
      }catch(err){ alert("이 파일은 시간표 백업 파일이 아니에요. 저장해 둔 .json 백업 파일을 골라 주세요."); }
      el.value = "";
    });
    return;
  }
  if(el.dataset.act==="tick"){
    const list = listFor(el); const p = list && list.find(x=>x.id===el.dataset.id);
    if(p){ p.d = el.checked; changed(); el.closest("li").classList.toggle("done", el.checked); if(!el.closest("dialog")) {/* keep focus */} else render(); }
  }
});
document.addEventListener("keydown", e=>{
  const el = e.target;
  if(e.key==="Enter" && el.dataset && el.dataset.addfor && !e.isComposing){
    e.preventDefault(); const btn = el.parentElement.querySelector("button"); if(btn) addFrom(btn);
  }
});
document.addEventListener("input", e=>{
  const el = e.target;
  if(el.dataset.act==="guard"){ state.guard = el.value; changed(); return; }
  if(!el.closest("dialog")) return;
  const dd = day(curKey);
  if(el.dataset.f){
    const it = dd.items.find(i=>i.id===el.dataset.item); if(!it) return;
    const f = el.dataset.f;
    it[f] = el.type==="checkbox" ? el.checked : el.value;
    changed(); render();
  } else if(el.dataset.df){
    const f = el.dataset.df;
    dd[f] = el.type==="checkbox" ? el.checked : el.value;
    changed(); render();
  }
});

/* ---------- sheet ---------- */
const sheet = document.getElementById("sheet");
let curKey = null;
function openSheet(k){ curKey = k; renderSheet(); sheet.showModal(); }
sheet.addEventListener("click", e=>{ if(e.target===sheet) sheet.close(); });
sheet.addEventListener("close", ()=>{ render(); flush(); });
function timeButtons(it){
  const custom = !TIMES.some(o=>o.v===it.time);
  return `<div class="seg" role="group" aria-label="시간 선택">${TIMES.map(o=>`<button type="button" class="segb" data-act="settime" data-item="${it.id}" data-v="${o.v}" aria-pressed="${it.time===o.v}">${o.l}<small>${o.v.replace("–","~")}</small></button>`).join("")}<button type="button" class="segb" data-act="customtime" data-item="${it.id}" aria-pressed="${custom}">직접<small>입력</small></button></div>`
    + (custom ? `<input type="text" style="margin-top:6px" value="${esc(it.time)}" data-f="time" data-item="${it.id}" placeholder="예: 10:00–12:00" aria-label="시간 직접 입력">` : "");
}
function renderSheet(){
  const x = dayInfo[curKey], dd = day(curKey);
  let h = `<div class="sh"><b id="sheetTitle">${x.m}월 ${x.d}일 ${DOW[x.dow]}요일 <span style="font-weight:400;color:var(--muted);font-size:.9rem">${x.week}주</span></b>
    <button type="button" class="btn" data-act="close">완료</button></div><div class="body">
    <p class="hint">고치는 즉시 저장돼요.</p>`;
  if(!dd.items.length) h += `<p class="hint">이날은 일정이 없어요. 아래에서 추가할 수 있어요.</p>`;
  dd.items.forEach((it,idx)=>{
    h += `<div class="itemcard"><div class="ih"><span class="sub" style="margin:0">일정 ${dd.items.length>1?idx+1:""}</span>
      <button type="button" class="btn danger" data-act="delitem" data-item="${it.id}">지우기</button></div>
      <div class="field"><label for="t_${it.id}">무엇</label><input id="t_${it.id}" type="text" value="${esc(it.title)}" data-f="title" data-item="${it.id}" placeholder="예: 로프 접근 기술"></div>
      <div class="field"><label for="r_${it.id}">구분</label><select id="r_${it.id}" data-f="role" data-item="${it.id}">${ROLES.map(r=>`<option${r===roleLabel(it.role)?" selected":""}>${r}</option>`).join("")}</select></div>
      <div class="field"><span class="flabel">시간</span>${timeButtons(it)}</div>
      <div class="field"><label for="p_${it.id}">장소</label><input id="p_${it.id}" type="text" value="${esc(it.place)}" data-f="place" data-item="${it.id}" placeholder="예: 구조훈련장"></div>
      <div class="field"><label for="m_${it.id}">주교관</label><input id="m_${it.id}" type="text" value="${esc(it.main)}" data-f="main" data-item="${it.id}"></div>
      <label class="toggle"><input type="checkbox" ${it.special?"checked":""} data-f="special" data-item="${it.id}"> 특별한 날로 표시 (평가·출장·시찰 등)</label>
      <div class="sub">준비할 것</div>
      ${checklist(it.prep||[], "prep", `data-k="${curKey}" data-item="${it.id}"`)}
      <div class="add"><input type="text" placeholder="준비할 것 추가" data-addfor="prep" data-k="${curKey}" data-item="${it.id}" aria-label="준비할 것 추가"><button type="button" data-act="add" data-scope="prep" data-k="${curKey}" data-item="${it.id}">추가</button></div>
    </div>`;
  });
  h += `<button type="button" class="btn ghost" data-act="additem" style="width:100%;margin-bottom:14px">+ 일정 추가</button>
    <label class="toggle"><input type="checkbox" ${dd.fitness?"checked":""} data-df="fitness"> 16:00–17:30 체력단련</label>
    <div class="field"><label for="dn">메모</label><textarea id="dn" rows="3" data-df="note" placeholder="이날 기억할 것">${esc(dd.note)}</textarea></div>
  </div>`;
  sheet.innerHTML = h;
}

document.getElementById("fab").addEventListener("click", ()=>{
  if(sheet.open) sheet.close();
  const inp = document.getElementById("memoIn");
  document.getElementById("memoSec").scrollIntoView({behavior:"smooth",block:"center"});
  inp.focus({preventScroll:true});
});

render();
setStatus("이 기기에 저장됨");
connect();
loadWeather();
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) loadWeather(); });
if("serviceWorker" in navigator && location.protocol==="https:"){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
})();
</script>
</body>
</html>
